name: VKTunnel

targets:
  VKTunnel:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [VKTunnel]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vktunnel.app
    entitlements:
      path: VKTunnel/VKTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel
    dependencies:
      - target: PacketTunnel

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources: [PacketTunnel]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vktunnel.app.PacketTunnel
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PacketTunnel
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
