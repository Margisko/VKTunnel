name: Build iOS VPN IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      # 1. Клонирование репозитория
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Установка XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen || true

      # 3. Генерация Xcode-проекта формата 56
      - name: Generate Xcode Project
        run: xcodegen generate

      # 4. Сборка архива дефолтным Xcode
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project "VKTunnel.xcodeproj" \
            -scheme "VKTunnel" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/VKTunnel.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 5. Упаковка в .ipa
      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/VKTunnel.xcarchive/Products/Applications/VKTunnel.app Payload/
          zip -r VKTunnel-Unsigned.ipa Payload

      # 6. Выгрузка готового артефакта
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKTunnel-Unsigned-IPA
          path: VKTunnel-Unsigned.ipa
